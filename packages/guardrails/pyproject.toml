[project]
name = "osaip-guardrails"
version = "0.1.0"
description = "OSAIP guardrails — PII detection/redaction, prompt-injection posture, policy stages"
requires-python = ">=3.12"
# The deterministic layer deliberately has NO dependencies: BSN/IBAN/email detection
# must work in an air-gapped install with no model downloads. Presidio + the Dutch spaCy
# model are an optional extra layered on top (ADR-0008 §5).
dependencies = []

# Presidio is an EXTRA, not a dependency: the deterministic layer above must keep
# working in an install that has neither. Pinned exactly (§3.1). The spaCy MODEL is
# deliberately absent — nl_core_news_sm is CC BY-SA 4.0 and OSAIP does not redistribute
# it; operators install the pinned wheel themselves (ADR-0009).
[project.optional-dependencies]
presidio = [
    # analyzer only: it DETECTS, and `redact.apply_redactions` does the replacing.
    # presidio-anonymizer is deliberately absent — we never imported it, and its
    # `cryptography <44.1` cap dragged the workspace from 49.0.0 down to a release with
    # four known CVEs (caught by the CI dependency audit). An unused dependency is not
    # worth a CVE.
    "presidio-analyzer==2.2.362",
    "spacy>=3.8,<3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osaip_guardrails"]
