[project]
name = "osaip-guardrails"
version = "0.1.0"
description = "OSAIP guardrails — PII detection/redaction, prompt-injection posture, policy stages"
requires-python = ">=3.12"
# The deterministic layer deliberately has NO dependencies: BSN/IBAN/email detection
# must work in an air-gapped install with no model downloads. Presidio + the Dutch spaCy
# model are an optional extra layered on top (ADR-0008 §5).
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osaip_guardrails"]
