[project]
name = "osaip-mesh"
version = "0.1.0"
description = "OSAIP LLM Mesh — the gateway every model call passes through (spec §5b)"
requires-python = ">=3.12"
dependencies = [
    # The mesh imports osaip_api models/Vault/events, like the worker does
    # (ADR-0008 §11; the ADR-0007 §8 refactor trigger covers all three consumers).
    "osaip-api",
    "osaip-shared",
    # The mesh is the only consumer that needs the model-backed PII layer.
    "osaip-guardrails[presidio]",
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    # Pinned EXACT: litellm moves fast and its provider-routing behaviour is the thing
    # we depend on. It is wrapped behind our own Provider protocol (§10) and imported
    # ONLY here — the §5b grep gate proves no other package touches a provider SDK.
    "litellm==1.95.0",
    # Token ESTIMATES only (quota sizing, and the fallback when a provider omits
    # usage). Never used to bill: the ledger records the provider's reported counts.
    "tiktoken>=0.13,<0.14",
]

[tool.uv.sources]
osaip-api = { workspace = true }
osaip-shared = { workspace = true }
osaip-guardrails = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osaip_mesh"]
